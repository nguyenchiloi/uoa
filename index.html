<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ú Òa</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #14101c;
    --bg2: #1c1626;
    --card: #241d33;
    --card-line: #362b48;
    --ink: #f3eefb;
    --muted: #a99bc2;
    --accent: #ff5a4c;
    --accent2: #ff9a3d;
    --shadow: 0 30px 70px -30px rgba(0,0,0,.7);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1100px 600px at 15% -10%, rgba(255,255,255,.06), transparent 60%),
      radial-gradient(900px 700px at 110% 10%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 55%),
      var(--bg);
    min-height: 100%;
    display: flex;
    justify-content: center;
    padding: 26px 16px 40px;
    transition: background .5s ease;
  }

  /* theme accents per category */
  body[data-cat="food"]   { --accent: #ff5a4c; --accent2: #ff9a3d; }
  body[data-cat="drink"]  { --accent: #ec4899; --accent2: #a855f7; }
  body[data-cat="travel"] { --accent: #06b6d4; --accent2: #22c55e; }
  body[data-cat="folk"]   { --accent: #d97706; --accent2: #65a30d; }
  body[data-cat="group"]  { --accent: #818cf8; --accent2: #c084fc; }
  body[data-cat="online"] { --accent: #22d3ee; --accent2: #6366f1; }
  body[data-cat="anvat"]  { --accent: #f97316; --accent2: #f43f5e; }
  body[data-cat="quan"]   { --accent: #b45309; --accent2: #eab308; }
  body[data-cat="nhau"]   { --accent: #dc2626; --accent2: #f59e0b; }

  .wrap { width: 100%; max-width: 620px; }

  .top {
    text-align: center;
    margin-bottom: 22px;
  }
  .top h1 {
    font-size: 1.9rem;
    font-weight: 800;
    letter-spacing: -.02em;
    background: linear-gradient(120deg, #fff, #d9cdf0);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .top p {
    margin-top: 6px;
    color: var(--muted);
    font-size: .92rem;
  }
  .top .slogan {
    font-style: italic;
    color: color-mix(in srgb, var(--accent2) 65%, var(--muted));
  }
  #topSub { margin-top: 4px; }

  .footer {
    text-align: center;
    margin-top: 28px;
    color: var(--muted);
    font-size: .78rem;
    letter-spacing: .02em;
  }
  .footer b { color: var(--ink); }

  [hidden] { display: none !important; }

  /* ---------- Category screen ---------- */
  .cat-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  @media (min-width: 480px) {
    .cat-grid { grid-template-columns: repeat(3, 1fr); }
  }

  .cat-card {
    position: relative;
    border: 1px solid var(--card-line);
    background: linear-gradient(155deg, var(--card), #1a1526);
    border-radius: 20px;
    padding: 18px 14px 16px;
    cursor: pointer;
    text-align: center;
    color: inherit;
    font-family: inherit;
    overflow: hidden;
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .cat-card::before {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(120px 90px at 50% -10%, var(--tint, rgba(255,255,255,.12)), transparent 70%);
    opacity: .9;
    pointer-events: none;
  }
  .cat-card:hover {
    transform: translateY(-4px);
    border-color: color-mix(in srgb, var(--tint2, #fff) 40%, var(--card-line));
    box-shadow: var(--shadow);
  }
  .cat-card .icon {
    font-size: 2.1rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 60px; height: 60px;
    border-radius: 18px;
    margin: 0 auto 10px;
    background: linear-gradient(135deg, var(--tint2a), var(--tint2b));
    box-shadow: 0 10px 22px -10px color-mix(in srgb, var(--tint2a) 70%, transparent);
  }
  .cat-card .label {
    font-weight: 700;
    font-size: .96rem;
    line-height: 1.25;
  }
  .cat-card .count {
    margin-top: 4px;
    font-size: .76rem;
    color: var(--muted);
  }

  /* ---------- Spin screen ---------- */
  .backbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .back-btn {
    border: 1px solid var(--card-line);
    background: var(--card);
    color: var(--ink);
    font-family: inherit;
    font-size: .85rem;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .back-btn:hover { border-color: var(--accent); }
  .cat-title {
    font-weight: 800;
    font-size: 1.15rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .reel-shell {
    position: relative;
    border-radius: 22px;
    padding: 3px;
    background: linear-gradient(120deg, var(--accent), var(--accent2));
    box-shadow: var(--shadow);
    overflow: hidden;
    animation: shellGlow 1.6s ease-in-out infinite;
    animation-play-state: paused;
  }
  .reel-shell.is-spinning { animation-play-state: running; }
  .reel-shell.is-spinning::before {
    content: "";
    position: absolute;
    inset: -60%;
    background: conic-gradient(var(--accent), var(--accent2), #fff, var(--accent2), var(--accent));
    animation: shellRotate 1s linear infinite;
  }
  @keyframes shellRotate {
    to { transform: rotate(360deg); }
  }
  @keyframes shellGlow {
    0%, 100% { box-shadow: var(--shadow), 0 0 0 0 color-mix(in srgb, var(--accent2) 55%, transparent); }
    50% { box-shadow: var(--shadow), 0 0 30px 6px color-mix(in srgb, var(--accent2) 55%, transparent); }
  }
  .reel-viewport {
    position: relative;
    overflow: hidden;
    border-radius: 20px;
    background: linear-gradient(180deg, #100b18, #1a1424);
    padding: 22px 0;
  }
  .reel-track {
    display: flex;
    align-items: center;
    gap: 14px;
    will-change: transform;
    padding: 0 14px;
  }
  .reel-card {
    flex: 0 0 auto;
    width: 108px;
    border-radius: 14px;
    overflow: hidden;
    background: #241d33;
    border: 2px solid #3a3050;
    transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
  }
  .reel-card .thumb {
    width: 108px;
    height: 108px;
    object-fit: cover;
    display: block;
  }
  body[data-cat="online"] .reel-card .thumb {
    object-fit: contain;
    background: #fff;
    padding: 12px;
    box-sizing: border-box;
  }
  body[data-cat="online"] .result .rphoto {
    background: #fff;
  }
  body[data-cat="online"] .result .rphoto img {
    object-fit: contain;
    padding: 10px;
    box-sizing: border-box;
  }
  .reel-card .thumb-emoji {
    width: 108px;
    height: 108px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.6rem;
    background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 35%, #241d33), color-mix(in srgb, var(--accent2) 35%, #241d33));
  }
  .reel-card .rname {
    font-size: .68rem;
    font-weight: 600;
    text-align: center;
    padding: 6px 4px 7px;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .reel-card.is-winner {
    border-color: var(--accent2);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent2) 45%, transparent), 0 12px 26px -10px color-mix(in srgb, var(--accent2) 70%, transparent);
    transform: scale(1.06);
  }

  .reel-fade-l, .reel-fade-r {
    position: absolute;
    top: 0; bottom: 0;
    width: 64px;
    pointer-events: none;
    z-index: 3;
  }
  .reel-fade-l { left: 0; background: linear-gradient(90deg, #100b18, transparent); }
  .reel-fade-r { right: 0; background: linear-gradient(270deg, #100b18, transparent); }

  .pointer {
    position: absolute;
    left: 50%;
    top: 0; bottom: 0;
    width: 2px;
    background: color-mix(in srgb, var(--accent2) 80%, #fff);
    transform: translateX(-50%);
    z-index: 4;
    box-shadow: 0 0 12px color-mix(in srgb, var(--accent2) 80%, transparent);
  }
  .pointer::before, .pointer::after {
    content: "";
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    border: 8px solid transparent;
  }
  .pointer::before {
    top: -1px;
    border-top: 10px solid var(--accent2);
  }
  .pointer::after {
    bottom: -1px;
    border-bottom: 10px solid var(--accent2);
  }

  .spin-btn {
    margin-top: 20px;
    width: 100%;
    border: 0;
    cursor: pointer;
    color: #fff;
    font-family: inherit;
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: .03em;
    padding: 17px 20px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 18px 34px -12px color-mix(in srgb, var(--accent) 70%, transparent);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
  }
  .spin-btn:hover:not(:disabled) { transform: translateY(-2px); }
  .spin-btn:active:not(:disabled) { transform: translateY(0) scale(.99); }
  .spin-btn:disabled { filter: grayscale(.35) brightness(.9); cursor: default; }
  .spin-btn.is-spinning { animation: btnPulse 1s ease-in-out infinite; }
  @keyframes btnPulse {
    0%, 100% { box-shadow: 0 18px 34px -12px color-mix(in srgb, var(--accent) 70%, transparent); }
    50% { box-shadow: 0 18px 44px -8px color-mix(in srgb, var(--accent2) 85%, transparent); }
  }

  .dice {
    display: inline-block;
    font-size: 1.2em;
  }
  .spin-btn.is-spinning .dice {
    animation: diceRoll .55s cubic-bezier(.4,0,.2,1) infinite;
  }
  @keyframes diceRoll {
    0%   { transform: rotate(0deg) scale(1); }
    25%  { transform: rotate(100deg) scale(1.15); }
    50%  { transform: rotate(200deg) scale(1); }
    75%  { transform: rotate(300deg) scale(1.15); }
    100% { transform: rotate(360deg) scale(1); }
  }

  .result {
    margin-top: 18px;
    background: var(--card);
    border: 1px solid var(--card-line);
    border-radius: 20px;
    padding: 18px;
    display: flex;
    gap: 14px;
    align-items: center;
    box-shadow: var(--shadow);
    animation: pop .35s ease;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(8px) scale(.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .result .rphoto {
    flex: 0 0 auto;
    width: 84px; height: 84px;
    border-radius: 14px;
    overflow: hidden;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 2.1rem;
  }
  .result .rphoto img { width: 100%; height: 100%; object-fit: cover; }
  .result .rtext { flex: 1 1 auto; min-width: 0; }
  .result .rtext .rn { font-weight: 800; font-size: 1.15rem; }
  .result .rtext .rd { color: var(--muted); font-size: .88rem; margin-top: 4px; line-height: 1.45; }
  .play-btn {
    margin-top: 10px;
    border: 0;
    cursor: pointer;
    color: #fff;
    font-family: inherit;
    font-weight: 700;
    font-size: .85rem;
    padding: 9px 14px;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 10px 20px -10px color-mix(in srgb, var(--accent) 70%, transparent);
  }
  .play-btn:hover { filter: brightness(1.06); }

  /* ---------- Mini game overlay ---------- */
  .mini-overlay {
    position: fixed;
    inset: 0;
    background: rgba(8, 5, 14, .72);
    backdrop-filter: blur(3px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .mini-modal {
    position: relative;
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border: 1px solid var(--card-line);
    border-radius: 22px;
    padding: 22px 20px 20px;
    text-align: center;
    box-shadow: var(--shadow);
    animation: pop .3s ease;
  }
  .mini-close {
    position: absolute;
    top: 12px; right: 12px;
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1px solid var(--card-line);
    background: var(--bg2);
    color: var(--ink);
    font-size: .9rem;
    cursor: pointer;
  }
  .mini-modal h3 {
    font-size: 1.15rem;
    font-weight: 800;
    padding-right: 26px;
  }
  .mini-stage {
    min-height: 210px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 14px 0;
  }
  .mini-result {
    margin-bottom: 12px;
    padding: 12px 14px;
    border-radius: 14px;
    background: color-mix(in srgb, var(--accent2) 16%, var(--card));
    border: 1px solid color-mix(in srgb, var(--accent2) 40%, var(--card-line));
    color: var(--ink);
    font-weight: 700;
    font-size: 1rem;
    line-height: 1.4;
    animation: pop .3s ease;
  }
  .mini-action {
    width: 100%;
    border: 0;
    cursor: pointer;
    color: #fff;
    font-family: inherit;
    font-weight: 800;
    font-size: 1rem;
    padding: 13px 16px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 14px 26px -10px color-mix(in srgb, var(--accent) 70%, transparent);
  }
  .mini-action:disabled { filter: grayscale(.3) brightness(.9); cursor: default; }

  /* Wheel */
  .wheel-wrap { position: relative; width: 200px; height: 200px; }
  .wheel-pointer {
    position: absolute;
    top: -12px; left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-top: 18px solid var(--accent2);
    z-index: 2;
  }
  .wheel {
    width: 100%; height: 100%;
    border-radius: 50%;
    position: relative;
    border: 5px solid var(--card);
    box-shadow: 0 0 0 3px var(--accent2), var(--shadow);
    transition: transform 4.2s cubic-bezier(.1,.68,.18,1);
  }
  .wheel-num {
    position: absolute;
    top: 50%; left: 50%;
    width: 24px; height: 24px;
    margin: -12px 0 0 -12px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800;
    font-size: .82rem;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,.5);
  }
  .wheel-legend {
    font-size: .74rem;
    color: var(--muted);
    line-height: 1.6;
    text-align: left;
    max-height: 90px;
    overflow-y: auto;
    padding: 8px 10px;
    background: var(--bg2);
    border-radius: 10px;
    border: 1px solid var(--card-line);
  }
  .wheel-legend b { color: var(--ink); }

  /* Lots / cards */
  .slip-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .slip-btn {
    width: 56px; height: 74px;
    border-radius: 8px;
    border: 2px dashed color-mix(in srgb, var(--accent2) 55%, var(--card-line));
    background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 25%, var(--card)), var(--card));
    color: var(--accent2);
    font-size: 1.3rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .slip-btn:disabled { opacity: .35; cursor: default; }
  .card-btn {
    width: 58px; height: 82px;
    border-radius: 10px;
    border: 2px solid color-mix(in srgb, var(--accent2) 50%, var(--card-line));
    background: linear-gradient(155deg, color-mix(in srgb, var(--accent) 30%, var(--card)), var(--card));
    color: var(--accent2);
    font-size: 1.4rem;
    cursor: pointer;
  }
  .card-btn:disabled { opacity: .35; cursor: default; }

  /* Dice */
  .die-face {
    width: 84px; height: 84px;
    border-radius: 16px;
    background: #fff;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 12px;
    box-sizing: border-box;
    box-shadow: 0 10px 22px -10px rgba(0,0,0,.6);
    transition: transform .15s ease;
  }
  .die-face.is-rolling { animation: dieShake .12s linear infinite; }
  @keyframes dieShake {
    0% { transform: rotate(0deg); }
    50% { transform: rotate(12deg); }
    100% { transform: rotate(-12deg); }
  }
  .die-dot { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .die-dot::after {
    content: "";
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #1c1626;
  }

  .hint {
    text-align: center;
    margin-top: 14px;
    color: var(--muted);
    font-size: .8rem;
  }
  .hint kbd {
    font-family: inherit;
    background: var(--card);
    border: 1px solid var(--card-line);
    border-bottom-width: 2px;
    border-radius: 6px;
    padding: 1px 6px;
    font-size: .78rem;
  }
</style>
</head>
<body>
  <div class="wrap">

    <div class="top">
      <h1>Ú Òa 🎉</h1>
      <p class="slogan">Không biết chọn gì? Nhắm mắt bấm nút, để số phận lo phần còn lại!</p>
      <p id="topSub">Chọn một thể loại rồi bấm "Ú Òa" để vòng quay chọn giúp bạn.</p>
    </div>

    <!-- Screen 1: category picker -->
    <section id="screenCategories">
      <div class="cat-grid" id="catGrid"></div>
    </section>

    <!-- Screen 2: spin -->
    <section id="screenSpin" hidden>
      <div class="backbar">
        <button class="back-btn" id="backBtn">← Đổi thể loại</button>
        <div class="cat-title" id="catTitle"></div>
      </div>

      <div class="reel-shell">
        <div class="reel-viewport" id="reelViewport">
          <div class="reel-track" id="reelTrack"></div>
          <div class="reel-fade-l"></div>
          <div class="reel-fade-r"></div>
          <div class="pointer"></div>
        </div>
      </div>

      <button class="spin-btn" id="spinBtn">
        <span class="dice" id="diceIcon">🎲</span>
        <span id="spinBtnText">Ú Òa</span>
      </button>

      <div class="result" id="result" hidden>
        <div class="rphoto" id="rphoto"><span id="rEmoji"></span></div>
        <div class="rtext">
          <div class="rn" id="rName"></div>
          <div class="rd" id="rDesc"></div>
          <button class="play-btn" id="playBtn" hidden>🎮 Chơi ngay</button>
        </div>
      </div>

      <p class="hint">Mẹo: nhấn phím <kbd>Space</kbd> để "Ú Òa" nhanh</p>
    </section>

    <p class="footer">Được làm bởi <b>Chú Vịt Vàng (NCL)</b> 🦆</p>

    <div class="mini-overlay" id="miniOverlay" hidden>
      <div class="mini-modal">
        <button class="mini-close" id="miniClose">✕</button>
        <h3 id="miniTitle"></h3>
        <div class="mini-stage" id="miniStage"></div>
        <div class="mini-result" id="miniResult" hidden></div>
        <button class="mini-action" id="miniAction"></button>
      </div>
    </div>
  </div>

<script>
  // ---------------- data ----------------
  function w(file) {
    return "https://commons.wikimedia.org/wiki/Special:FilePath/" + encodeURIComponent(file) + "?width=800";
  }

  const CATEGORIES = {
    food: {
      label: "Món ăn", emoji: "🍜", tint2a: "#ff5a4c", tint2b: "#ff9a3d",
      items: [
        { name: "Cơm tấm sườn bì chả", emoji: "🍚", file: "Cơm tấm sườn bì chả.jpg", desc: "Sườn nướng, bì, chả trứng, mỡ hành, chan nước mắm chua ngọt." },
        { name: "Cơm nhà", emoji: "🍳", file: "Vietnamese family daily meal.jpg", desc: "Canh rau, thịt kho, cá kho, rau luộc — bữa cơm quen thuộc và nhẹ nhàng." },

  // ---------------- category screen ----------------
  const catGrid = document.getElementById("catGrid");
  Object.keys(CATEGORIES).forEach((key) => {
    const cat = CATEGORIES[key];
    const btn = document.createElement("button");
    btn.className = "cat-card";
    btn.style.setProperty("--tint2a", cat.tint2a);
    btn.style.setProperty("--tint2b", cat.tint2b);
    btn.style.setProperty("--tint2", cat.tint2a);
    btn.innerHTML =
      '<div class="icon">' + cat.emoji + '</div>' +
      '<div class="label">' + cat.label + '</div>' +
      '<div class="count">' + cat.items.length + ' mục</div>';
    btn.addEventListener("click", () => openCategory(key));
    catGrid.appendChild(btn);
  });

  // ---------------- spin screen ----------------
  const screenCategories = document.getElementById("screenCategories");
  const screenSpin = document.getElementById("screenSpin");
  const catTitle = document.getElementById("catTitle");
  const backBtn = document.getElementById("backBtn");
  const reelViewport = document.getElementById("reelViewport");
  const reelTrack = document.getElementById("reelTrack");
  const spinBtn = document.getElementById("spinBtn");
  const spinBtnText = document.getElementById("spinBtnText");
  const result = document.getElementById("result");
  const rphoto = document.getElementById("rphoto");
  const rEmoji = document.getElementById("rEmoji");
  const rName = document.getElementById("rName");
  const rDesc = document.getElementById("rDesc");
  const topSub = document.getElementById("topSub");

  let currentKey = null;
  let spinning = false;

  function openCategory(key) {
    currentKey = key;
    const cat = CATEGORIES[key];
    document.body.setAttribute("data-cat", key);
    catTitle.textContent = cat.emoji + " " + cat.label;
    topSub.textContent = "Bấm \"Ú Òa\" để vòng quay chọn ngẫu nhiên trong " + cat.label.toLowerCase() + ".";
    screenCategories.hidden = true;
    screenSpin.hidden = false;
    result.hidden = true;
    spinBtnText.textContent = "Ú Òa";
    renderStaticReel(key);
  }

  backBtn.addEventListener("click", () => {
    screenSpin.hidden = true;
    screenCategories.hidden = false;
    topSub.textContent = "Chọn một thể loại rồi bấm \"Ú Òa\" để vòng quay chọn giúp bạn.";
    document.body.removeAttribute("data-cat");
  });

  function renderCard(item) {
    const media = item.file
      ? '<img class="thumb" src="' + w(item.file) + '" alt="" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement(\'div\'),{className:\'thumb-emoji\',textContent:\'' + item.emoji + '\'}))" />'
      : '<div class="thumb-emoji">' + item.emoji + '</div>';
    return '<div class="reel-card">' + media + '<div class="rname">' + item.name + '</div></div>';
  }

  function renderStaticReel(key) {
    const items = CATEGORIES[key].items;
    const rotation = Math.floor(Math.random() * items.length);
    const preview = [];
    for (let i = 0; i < Math.min(8, items.length); i++) {
      preview.push(items[(i + rotation) % items.length]);
    }
    reelTrack.style.transition = "none";
    reelTrack.style.transform = "translateX(0px)";
    reelTrack.innerHTML = preview.map(renderCard).join("");
  }

  const REEL_LEN = 40;
  const WINNER_IDX = 32;

  function pickRandom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  // Builds a reel by cycling through the FULL item list in its original
  // order, starting from a random rotation point. This means the reel
  // always scrolls through every item from start to end before repeating
  // (instead of randomly reshuffling, which can look like the same handful
  // of items keep popping up). The winner is simply whatever item lands
  // at WINNER_IDX for the chosen rotation, so the result is still uniformly
  // random across the whole list.
  function buildReelSequence(items, length, rotation) {
    const n = items.length;
    const seq = [];
    for (let i = 0; i < length; i++) {
      seq.push(items[(i + rotation) % n]);
    }
    return seq;
  }

  function spin() {
    if (spinning || !currentKey) return;
    spinning = true;
    spinBtn.disabled = true;
    spinBtnText.textContent = "Đang mở...";
    spinBtn.classList.add("is-spinning");
    reelViewport.closest(".reel-shell").classList.add("is-spinning");
    result.hidden = true;

    const items = CATEGORIES[currentKey].items;
    const rotation = Math.floor(Math.random() * items.length);
    const reelItems = buildReelSequence(items, REEL_LEN, rotation);
    const winner = reelItems[WINNER_IDX];

    reelTrack.style.transition = "none";
    reelTrack.style.transform = "translateX(0px)";
    reelTrack.innerHTML = reelItems.map(renderCard).join("");

    // force reflow
    void reelTrack.offsetWidth;

    const cards = reelTrack.children;
    const slotWidth = cards[1].getBoundingClientRect().left - cards[0].getBoundingClientRect().left;
    const winnerCard = cards[WINNER_IDX];
    const viewportWidth = reelViewport.clientWidth;
    const targetCenter = winnerCard.offsetLeft + winnerCard.offsetWidth / 2;
    const jitter = (Math.random() - 0.5) * (slotWidth * 0.35);
    const offset = targetCenter - viewportWidth / 2 + jitter;

    requestAnimationFrame(() => {
      reelTrack.style.transition = "transform 5.4s cubic-bezier(.09,.79,.13,1)";
      reelTrack.style.transform = "translateX(-" + offset + "px)";
    });

    function onEnd(e) {
      if (e.propertyName !== "transform") return;
      reelTrack.removeEventListener("transitionend", onEnd);
      winnerCard.classList.add("is-winner");

      if (winner.file) {
        rphoto.innerHTML = '<img src="' + w(winner.file) + '" alt="" referrerpolicy="no-referrer" onerror="this.parentElement.innerHTML=\'' + winner.emoji + '\'" />';
      } else {
        rphoto.textContent = winner.emoji;
      }
      rName.textContent = winner.name;
      rDesc.textContent = winner.desc;
      result.hidden = false;

      if (winner.play) {
        playBtn.hidden = false;
        playBtn.onclick = () => openMiniGame(winner.play, winner.name);
      } else {
        playBtn.hidden = true;
        playBtn.onclick = null;
      }

      spinning = false;
      spinBtn.disabled = false;
      spinBtn.classList.remove("is-spinning");
      reelViewport.closest(".reel-shell").classList.remove("is-spinning");
      spinBtnText.textContent = "Ú Òa lần nữa";
    }
    reelTrack.addEventListener("transitionend", onEnd);
  }

  spinBtn.addEventListener("click", spin);
  document.addEventListener("keydown", (e) => {
    if ((e.code === "Space" || e.key === "Enter") && !screenSpin.hidden) {
      e.preventDefault();
      spin();
    }
  });

  // ==================== Mini games (Trò chơi ăn nhậu) ====================
  const playBtn = document.getElementById("playBtn");
  const miniOverlay = document.getElementById("miniOverlay");
  const miniClose = document.getElementById("miniClose");
  const miniTitle = document.getElementById("miniTitle");
  const miniStage = document.getElementById("miniStage");
  const miniResult = document.getElementById("miniResult");
  const miniAction = document.getElementById("miniAction");

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  const LOT_OUTCOMES = [
    "Uống 1 ly 🍺", "Uống cạn ly luôn! 🥴", "Được tha, khỏi uống 🎉",
    "Mời 1 người bất kỳ uống cùng", "Kể 1 câu chuyện xui xẻo",
    "Bắt chước tiếng 1 con vật bất kỳ", "Nhảy 1 điệu trong 10 giây",
    "Đổi ghế với người bên cạnh", "Uống 2 ly 🍻", "Hát 1 câu bài hát bất kỳ",
    "Nói 1 câu tỏ tình ngẫu hứng", "Im lặng không nói gì trong 1 phút",
  ];
  const WHEEL_OUTCOMES = [
    "Uống 1 ly", "Uống 2 ly", "Mời người bên trái uống",
    "Mời người bên phải uống", "Được tha, khỏi uống", "Uống cạn ly",
    "Làm 1 thử thách bất kỳ", "Hát 1 câu bất kỳ",
  ];
  const DICE_OUTCOMES = [
    "Uống 1 ly", "Uống 2 ly", "Mời 1 người uống cùng",
    "Được tha, khỏi uống", "Uống cạn ly", "Làm 1 thử thách vui",
  ];
  const DIE_LAYOUTS = {
    1: [4],
    2: [0, 8],
    3: [0, 4, 8],
    4: [0, 2, 6, 8],
    5: [0, 2, 4, 6, 8],
    6: [0, 2, 3, 5, 6, 8],
  };

  let miniType = null;

  function openMiniGame(type, name) {
    miniType = type;
    miniTitle.textContent = name;
    miniResult.hidden = true;
    miniResult.textContent = "";
    miniOverlay.hidden = false;
    if (type === "lots") setupLots();
    else if (type === "wheel") setupWheel();
    else if (type === "cards") setupCards();
    else if (type === "dice") setupDice();
  }

  function closeMiniGame() {
    miniOverlay.hidden = true;
    miniAction.onclick = null;
  }
  miniClose.addEventListener("click", closeMiniGame);
  miniOverlay.addEventListener("click", (e) => {
    if (e.target === miniOverlay) closeMiniGame();
  });

  // ---- Bốc thăm may rủi ----
  function setupLots() {
    const picks = shuffle(LOT_OUTCOMES).slice(0, 6);
    miniStage.innerHTML =
      '<div class="slip-grid">' +
      picks.map((_, i) => '<button class="slip-btn" data-i="' + i + '">🎫</button>').join("") +
      "</div>";
    miniAction.textContent = "Chơi lại";
    miniAction.disabled = true;
    miniAction.onclick = setupLots;

    miniStage.querySelectorAll(".slip-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        if (miniStage.dataset.locked) return;
        miniStage.dataset.locked = "1";
        miniStage.querySelectorAll(".slip-btn").forEach((b) => { if (b !== btn) b.disabled = true; });
        btn.textContent = "✅";
        miniResult.textContent = picks[+btn.dataset.i];
        miniResult.hidden = false;
        miniAction.disabled = false;
      });
    });
    delete miniStage.dataset.locked;
  }

  // ---- Rút bài định mệnh ----
  function setupCards() {
    const picks = shuffle(LOT_OUTCOMES).slice(0, 6);
    miniStage.innerHTML =
      '<div class="slip-grid">' +
      picks.map((_, i) => '<button class="card-btn" data-i="' + i + '">🂠</button>').join("") +
      "</div>";
    miniAction.textContent = "Chơi lại";
    miniAction.disabled = true;
    miniAction.onclick = setupCards;

    miniStage.querySelectorAll(".card-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        if (miniStage.dataset.locked) return;
        miniStage.dataset.locked = "1";
        miniStage.querySelectorAll(".card-btn").forEach((b) => { if (b !== btn) b.disabled = true; });
        btn.textContent = "🃏";
        miniResult.textContent = picks[+btn.dataset.i];
        miniResult.hidden = false;
        miniAction.disabled = false;
      });
    });
    delete miniStage.dataset.locked;
  }

  // ---- Vòng quay may mắn ----
  let wheelCumulative = 0;
  function setupWheel() {
    const n = WHEEL_OUTCOMES.length;
    const seg = 360 / n;
    const colors = ["var(--accent)", "var(--accent2)"];
    const stops = [];
    for (let i = 0; i < n; i++) {
      stops.push(colors[i % 2] + " " + (i * seg) + "deg " + ((i + 1) * seg) + "deg");
    }
    const nums = [];
    for (let i = 0; i < n; i++) {
      const mid = i * seg + seg / 2;
      nums.push('<div class="wheel-num" style="transform: rotate(' + mid + 'deg) translateY(-72px)">' + (i + 1) + "</div>");
    }
    wheelCumulative = 0;
    miniStage.innerHTML =
      '<div class="wheel-wrap"><div class="wheel-pointer"></div><div class="wheel" id="wheelEl" style="background: conic-gradient(' + stops.join(", ") + ')">' + nums.join("") + "</div></div>" +
      '<div class="wheel-legend">' + WHEEL_OUTCOMES.map((t, i) => "<div><b>" + (i + 1) + ".</b> " + t + "</div>").join("") + "</div>";
    miniAction.textContent = "Quay!";
    miniAction.disabled = false;
    miniAction.onclick = spinWheel;
  }
  function spinWheel() {
    miniAction.disabled = true;
    miniResult.hidden = true;
    const n = WHEEL_OUTCOMES.length;
    const seg = 360 / n;
    const winIdx = Math.floor(Math.random() * n);
    const wheelEl = document.getElementById("wheelEl");

    // Rotate so the chosen segment's center lands under the top pointer,
    // always spinning forward (never backward) from the current position.
    const mid = winIdx * seg + seg / 2;
    const desiredMod = (360 - mid + 360) % 360;
    const currentMod = ((wheelCumulative % 360) + 360) % 360;
    let delta = desiredMod - currentMod;
    if (delta <= 0) delta += 360;
    wheelCumulative += 360 * 5 + delta;
    wheelEl.style.transform = "rotate(" + wheelCumulative + "deg)";

    function onWheelEnd(e) {
      if (e.propertyName !== "transform") return;
      wheelEl.removeEventListener("transitionend", onWheelEnd);
      miniResult.textContent = (winIdx + 1) + ". " + WHEEL_OUTCOMES[winIdx];
      miniResult.hidden = false;
      miniAction.disabled = false;
      miniAction.textContent = "Quay lại";
    }
    wheelEl.addEventListener("transitionend", onWheelEnd);
  }

  // ---- Xúc xắc định mệnh ----
  function dieCellsHtml(value) {
    const dots = DIE_LAYOUTS[value];
    let cells = "";
    for (let i = 0; i < 9; i++) {
      cells += dots.includes(i) ? '<div class="die-dot"></div>' : "<div></div>";
    }
    return cells;
  }
  function setupDice() {
    miniStage.innerHTML = '<div class="die-face" id="dieEl">' + dieCellsHtml(1) + "</div>";
    miniAction.textContent = "Đổ xúc xắc!";
    miniAction.disabled = false;
    miniAction.onclick = rollDice;
  }
  function rollDice() {
    miniAction.disabled = true;
    miniResult.hidden = true;
    const dieEl = document.getElementById("dieEl");
    dieEl.classList.add("is-rolling");
    let ticks = 0;
    const timer = setInterval(() => {
      dieEl.innerHTML = dieCellsHtml(1 + Math.floor(Math.random() * 6));
      ticks++;
      if (ticks >= 10) {
        clearInterval(timer);
        dieEl.classList.remove("is-rolling");
        const finalValue = 1 + Math.floor(Math.random() * 6);
        dieEl.innerHTML = dieCellsHtml(finalValue);
        miniResult.textContent = "🎲 " + finalValue + " — " + DICE_OUTCOMES[finalValue - 1];
        miniResult.hidden = false;
        miniAction.disabled = false;
        miniAction.textContent = "Đổ lại";
      }
    }, 80);
  }
</script>
</body>
</html>
